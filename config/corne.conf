# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

CONFIG_ZMK_KEYBOARD_NAME="bw-corne"

# nice_view is built in build.yaml; ZMK_DISPLAY must be set explicitly or the
# screen stays blank.
CONFIG_ZMK_DISPLAY=y

# IDLE_TIMEOUT = display off; IDLE_SLEEP_TIMEOUT = deep sleep (both measured
# from last activity). 5s gap so the screen blanks just before deep sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=905000

# enable stronger bt connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Report the peripheral half's battery level to the central, and on to the host.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# This keymap is tap-dance and hold-tap heavy; the default queue (64) can drop
# events during fast rolls across home-row mods.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# enable pointing device
CONFIG_ZMK_POINTING=y

# Enable soft off functionality from the keymap or dedicated hardware
CONFIG_ZMK_PM_SOFT_OFF=y
